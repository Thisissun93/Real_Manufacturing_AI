name: Manufacturing Investigation Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test investigation and existing functions
        run: python -m pytest -q
      - name: Verify synthetic scenarios
        run: python -m src.investigation.evaluate_scenarios
